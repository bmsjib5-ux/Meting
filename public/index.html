<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meeting Room</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1e2330;
    --text: #e6e9ef;
    --muted: #8b94a7;
    --accent: #4f8cff;
    --danger: #ff5a5f;
    --ok: #2ecc71;
    --border: #262c39;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { cursor: pointer; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 8px 12px; border-radius: 8px; }
  button:hover { background: #29304040; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  input { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); padding: 8px 10px; border-radius: 8px; outline: none; }
  input:focus { border-color: var(--accent); }

  /* Lobby */
  #lobby { display: flex; align-items: center; justify-content: center; height: 100%; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 380px; }
  .card h1 { margin: 0 0 12px; font-size: 20px; }
  .card p { margin: 0 0 16px; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  /* Room layout */
  #room { display: none; height: 100%; grid-template-columns: 1fr 320px; grid-template-rows: 1fr auto; grid-template-areas: "videos side" "bar bar"; }
  #videos { grid-area: videos; padding: 12px; overflow: auto; display: grid; gap: 10px; align-content: start; --tile-min: 260px; }
  #videos.mode-grid { grid-template-columns: repeat(auto-fit, minmax(var(--tile-min), 1fr)); }
  #videos.size-small { --tile-min: 160px; }
  #videos.size-medium { --tile-min: 260px; }
  #videos.size-large { --tile-min: 420px; }
  #videos.mode-spotlight { grid-template-columns: repeat(12, 1fr); grid-auto-rows: minmax(80px, auto); }
  #videos.mode-spotlight .tile { grid-column: span 2; aspect-ratio: 16/9; cursor: pointer; }
  #videos.mode-spotlight .tile.spotlighted { grid-column: 1 / -1; aspect-ratio: 16/9; max-height: calc(100vh - 280px); cursor: default; }
  .tile { position: relative; background: #000; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; transition: outline .15s; }
  .tile.spotlighted { outline: 2px solid var(--accent); }
  .tile.peer-speaking { outline: 2px solid var(--ok); }
  .tile video { width: 100%; height: 100%; object-fit: cover; background: #000; }
  .tile video.filter-grayscale { filter: grayscale(1); }
  .tile video.filter-sepia { filter: sepia(1); }
  .tile video.filter-soft { filter: blur(.5px) saturate(1.15) brightness(1.05); }
  .tile video.filter-vivid { filter: contrast(1.2) saturate(1.4); }
  .tile video.filter-noir { filter: grayscale(1) contrast(1.3); }
  .tile .label { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.6); padding: 3px 8px; border-radius: 6px; font-size: 12px; max-width: calc(100% - 80px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .status { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; max-width: 60%; justify-content: flex-end; }
  .badge { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,.6); white-space: nowrap; }
  .badge.danger { background: rgba(255,90,95,.85); }
  .badge.warn { background: rgba(255,180,60,.85); color: #000; }
  .badge.host { background: rgba(255,210,80,.95); color: #000; }
  .badge.share { background: rgba(79,140,255,.9); }
  .tile.cam-off video { opacity: 0; }
  .tile.cam-off::after { content: "📷 ปิดกล้อง"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; background: linear-gradient(135deg, #1a1f2b, #0f1115); }
  .tile .reaction-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .reaction-fly { position: absolute; bottom: 8px; left: 50%; font-size: 40px; animation: floatUp 2.4s ease-out forwards; }
  @keyframes floatUp { 0% { transform: translate(-50%, 0) scale(.5); opacity: 0; } 15% { transform: translate(-50%, -20px) scale(1.1); opacity: 1; } 100% { transform: translate(-50%, -180px) scale(1); opacity: 0; } }

  #side { grid-area: side; border-left: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tabs button { flex: 1; border: none; background: transparent; padding: 12px; color: var(--muted); border-radius: 0; }
  .tabs button.active { color: var(--text); border-bottom: 2px solid var(--accent); }
  .tab-panel { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .tab-panel.active { display: flex; }

  #chat-log { flex: 1; overflow: auto; padding: 12px; }
  .msg { margin-bottom: 10px; }
  .msg .meta { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .msg .body { background: var(--panel-2); padding: 8px 10px; border-radius: 8px; word-wrap: break-word; white-space: pre-wrap; }
  #chat-form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--border); }
  #chat-form input { flex: 1; }

  #peer-list { padding: 12px; overflow: auto; }
  .peer { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; }
  .peer .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: 0 0 8px; }
  .peer .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .peer .mark { font-size: 12px; }
  .peer .mute-btn { padding: 3px 8px; font-size: 11px; }

  #bar { grid-area: bar; display: flex; gap: 6px; align-items: center; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--border); flex-wrap: wrap; position: relative; }
  #bar .spacer { flex: 1; }
  #bar .room-tag { font-size: 12px; color: var(--muted); }
  #bar button.active { background: var(--accent); border-color: var(--accent); }
  .popup { position: absolute; bottom: 56px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.4); display: none; z-index: 50; }
  .popup.open { display: flex; flex-wrap: wrap; gap: 4px; }
  .popup button { padding: 6px 10px; font-size: 18px; }
  .filter-popup { flex-direction: column; align-items: stretch; min-width: 160px; }
  .filter-popup button { text-align: left; font-size: 13px; padding: 8px 10px; }
  .filter-popup button.active { background: var(--accent); color: #fff; }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; }
  .toast.show { opacity: 1; }
  .rec-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-right: 6px; animation: pulse 1s infinite; vertical-align: middle; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

  @media (max-width: 800px) {
    #room { grid-template-columns: 1fr; grid-template-areas: "videos" "side" "bar"; }
    #side { border-left: none; border-top: 1px solid var(--border); max-height: 40vh; }
  }

  /* Post-recording modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 720px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .modal header h2 { margin: 0; font-size: 16px; flex: 1; }
  .modal .body { padding: 16px; overflow: auto; flex: 1; min-height: 0; }
  .modal footer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .modal footer .spacer { flex: 1; }
  .modal .summary-md { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; white-space: pre-wrap; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; max-height: 50vh; overflow: auto; }
  .modal .transcript { margin-top: 12px; }
  .modal .transcript summary { cursor: pointer; color: var(--muted); font-size: 12px; padding: 4px 0; }
  .modal .transcript pre { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; white-space: pre-wrap; font-size: 12px; max-height: 30vh; overflow: auto; margin-top: 6px; }
  .spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .err { color: var(--danger); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>

<div id="lobby">
  <div class="card">
    <h1>🎥 Meeting Room</h1>
    <p>Enter your name and a room code to join.</p>
    <div class="field">
      <label for="name-input">Your name</label>
      <input id="name-input" placeholder="e.g. Alice" autocomplete="off" />
    </div>
    <div class="field">
      <label for="room-input">Room code</label>
      <input id="room-input" placeholder="e.g. team-standup" autocomplete="off" />
    </div>
    <div class="row">
      <button id="join-btn" class="primary">Join meeting</button>
    </div>
    <p id="lobby-error" style="color: var(--danger); margin-top: 12px; display: none;"></p>
  </div>
</div>

<div id="room">
  <div id="videos"></div>

  <aside id="side">
    <div class="tabs">
      <button data-tab="chat" class="active">💬 Chat</button>
      <button data-tab="people">👥 People (<span id="people-count">1</span>)</button>
    </div>
    <div id="tab-chat" class="tab-panel active">
      <div id="chat-log"></div>
      <form id="chat-form">
        <input id="chat-input" placeholder="Type a message…" autocomplete="off" maxlength="2000" />
        <button class="primary" type="submit">Send</button>
      </form>
    </div>
    <div id="tab-people" class="tab-panel">
      <div id="peer-list"></div>
    </div>
  </aside>

  <div id="bar">
    <button id="toggle-mic">🎤 Mic</button>
    <button id="toggle-cam">📷 Cam</button>
    <button id="toggle-share">🖥️ Share</button>
    <button id="toggle-record">⏺️ Record</button>
    <button id="toggle-hand" title="ยกมือถาม">✋ ยกมือ</button>
    <button id="toggle-react" title="ส่งอีโมจิ">😊 React</button>
    <button id="toggle-filter" title="ฟิลเตอร์วิดีโอ">🎨 Filter</button>
    <button id="toggle-view" title="มุมมอง">🪟 View</button>
    <button id="copy-link" title="คัดลอกลิงก์เชิญเพื่อน">🔗 คัดลอกลิงก์</button>
    <div class="spacer"></div>
    <div id="react-popup" class="popup">
      <button data-emoji="👍">👍</button>
      <button data-emoji="❤️">❤️</button>
      <button data-emoji="😂">😂</button>
      <button data-emoji="🎉">🎉</button>
      <button data-emoji="👏">👏</button>
      <button data-emoji="🔥">🔥</button>
      <button data-emoji="😮">😮</button>
      <button data-emoji="🙏">🙏</button>
    </div>
    <div id="filter-popup" class="popup filter-popup">
      <button data-filter="" class="active">ไม่มีฟิลเตอร์</button>
      <button data-filter="grayscale">ขาวดำ (Grayscale)</button>
      <button data-filter="sepia">วินเทจ (Sepia)</button>
      <button data-filter="soft">ผิวเนียน (Soft)</button>
      <button data-filter="vivid">สีสด (Vivid)</button>
      <button data-filter="noir">Noir</button>
      <p class="hint" style="padding: 0 6px;">ฟิลเตอร์จะส่งให้คนอื่นเห็นด้วย (canvas processing)</p>
    </div>
    <div id="view-popup" class="popup filter-popup">
      <button data-view="grid:small">Grid — เล็ก</button>
      <button data-view="grid:medium" class="active">Grid — กลาง</button>
      <button data-view="grid:large">Grid — ใหญ่</button>
      <button data-view="spotlight">Spotlight (จอใหญ่ + thumbs)</button>
      <p class="hint" style="padding: 0 6px;">คลิก tile เพื่อ pin เป็นจอใหญ่</p>
    </div>
    <span class="room-tag">Room: <strong id="room-tag-name"></strong></span>
    <button id="leave-btn" class="danger">Leave</button>
  </div>
</div>

<!-- Post-recording modal -->
<div id="rec-modal" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal">
    <header>
      <h2>🎬 บันทึกการประชุมเรียบร้อย</h2>
      <button id="rec-modal-close">✕</button>
    </header>
    <div class="body" id="rec-modal-body">
      <p>คุณจะดาวน์โหลดเป็นไฟล์ <code>.webm</code> หรือให้ AI ช่วยสรุปการประชุมจากเสียงเป็นข้อความก็ได้</p>
      <p class="hint" id="rec-info"></p>
      <div id="summary-result" style="display: none;">
        <div class="summary-md" id="summary-md"></div>
        <details class="transcript">
          <summary>ดู transcript เต็ม</summary>
          <pre id="summary-transcript"></pre>
        </details>
      </div>
      <p class="err" id="summary-error" style="display: none;"></p>
    </div>
    <footer>
      <button id="btn-download-video">⬇️ ดาวน์โหลดวิดีโอ</button>
      <button id="btn-summarize" class="primary">🤖 สรุปด้วย AI</button>
      <button id="btn-download-summary" style="display: none;">⬇️ ดาวน์โหลดสรุป (.md)</button>
      <div class="spacer"></div>
      <button id="btn-modal-done">เสร็จสิ้น</button>
    </footer>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const rtcConfig = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
    ],
  };

  const lobby = document.getElementById('lobby');
  const room = document.getElementById('room');
  const lobbyError = document.getElementById('lobby-error');
  const nameInput = document.getElementById('name-input');
  const roomInput = document.getElementById('room-input');
  const joinBtn = document.getElementById('join-btn');
  const videosEl = document.getElementById('videos');
  const peerListEl = document.getElementById('peer-list');
  const peopleCountEl = document.getElementById('people-count');
  const chatLog = document.getElementById('chat-log');
  const chatForm = document.getElementById('chat-form');
  const chatInput = document.getElementById('chat-input');
  const toggleMic = document.getElementById('toggle-mic');
  const toggleCam = document.getElementById('toggle-cam');
  const toggleShare = document.getElementById('toggle-share');
  const toggleRecord = document.getElementById('toggle-record');
  const toggleHand = document.getElementById('toggle-hand');
  const toggleReact = document.getElementById('toggle-react');
  const toggleFilter = document.getElementById('toggle-filter');
  const toggleView = document.getElementById('toggle-view');
  const reactPopup = document.getElementById('react-popup');
  const filterPopup = document.getElementById('filter-popup');
  const viewPopup = document.getElementById('view-popup');
  const toastEl = document.getElementById('toast');
  const copyLinkBtn = document.getElementById('copy-link');
  const leaveBtn = document.getElementById('leave-btn');
  const roomTagName = document.getElementById('room-tag-name');

  // Restore from query string and storage
  const qs = new URLSearchParams(location.search);
  if (qs.get('room')) roomInput.value = qs.get('room');
  if (localStorage.getItem('mr_name')) nameInput.value = localStorage.getItem('mr_name');

  // Auto-join: if URL carries a room and we already know the user's name
  // (returning visitor opening a shared link), submit the lobby immediately.
  // The room call's permission prompts and Leave button remain available as escape hatches.
  const autoJoin = qs.get('room') && localStorage.getItem('mr_name') && qs.get('lobby') !== '1';

  // Sync the view popup's active button with the persisted preference
  (function initViewPopupActive() {
    const target = viewMode === 'spotlight' ? 'spotlight' : 'grid:' + gridSize;
    for (const b of viewPopup.querySelectorAll('button[data-view]')) {
      b.classList.toggle('active', b.dataset.view === target);
    }
  })();

  let socket = null;
  let selfId = null;
  let hostId = null;
  let localStream = null;
  let cameraStream = null;       // Original webcam stream (kept while screen sharing)
  let rawCameraStream = null;    // Pre-filter camera stream (used to build filtered canvas stream)
  let screenStream = null;
  let displayName = 'Guest';
  let roomId = '';
  let micOn = true;
  let camOn = true;
  let sharing = false;
  let handRaised = false;
  let currentFilter = '';        // '' | 'grayscale' | 'sepia' | 'soft' | 'vivid' | 'noir'
  let viewMode = localStorage.getItem('mr_view_mode') || 'grid';     // 'grid' | 'spotlight'
  let gridSize = localStorage.getItem('mr_grid_size') || 'medium';   // 'small' | 'medium' | 'large'
  let pinnedSpotlightId = null;  // user-pinned spotlight peer (overrides auto)
  let recorder = null;
  let recordedChunks = [];
  let audioRecorder = null;
  let audioChunks = [];
  let recordingStartedAt = 0;
  let lastVideoBlob = null;
  let lastAudioBlob = null;
  let lastSummary = null;

  /** @type {Map<string, { pc: RTCPeerConnection, name: string, polite: boolean, makingOffer: boolean, ignoreOffer: boolean, videoSender: RTCRtpSender|null, audioSender: RTCRtpSender|null, mic: boolean, cam: boolean, sharing: boolean, handRaised: boolean }>} */
  const peers = new Map();

  function showToast(message, ms = 2500) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), ms);
  }

  function emitState(patch) {
    if (socket && socket.connected) socket.emit('state', patch);
  }

  function getEffectiveSpotlightId() {
    if (pinnedSpotlightId && (pinnedSpotlightId === 'self' || peers.has(pinnedSpotlightId))) {
      return pinnedSpotlightId;
    }
    // Auto-spotlight whoever is screen sharing (priority: remote, then self)
    for (const [id, entry] of peers) if (entry.sharing) return id;
    if (sharing) return 'self';
    return null;
  }

  function applyViewMode() {
    videosEl.classList.remove('mode-grid', 'mode-spotlight', 'size-small', 'size-medium', 'size-large');
    if (viewMode === 'spotlight' || (viewMode === 'grid' && getEffectiveSpotlightId())) {
      // Force spotlight layout whenever someone is sharing — that was an explicit requirement
      videosEl.classList.add('mode-spotlight');
    } else {
      videosEl.classList.add('mode-grid', 'size-' + gridSize);
    }
    const spotId = getEffectiveSpotlightId();
    for (const tile of videosEl.querySelectorAll('.tile')) {
      const id = tile.id.replace('tile-', '');
      tile.classList.toggle('spotlighted', id === spotId);
    }
  }

  function renderTileState(id) {
    const tile = document.getElementById('tile-' + id);
    if (!tile) return;
    const state = id === 'self'
      ? { mic: micOn, cam: camOn, sharing, handRaised, isHost: hostId === selfId, name: displayName + ' (you)' }
      : (() => {
          const p = peers.get(id);
          if (!p) return null;
          return { mic: p.mic, cam: p.cam, sharing: p.sharing, handRaised: p.handRaised, isHost: hostId === id, name: p.name };
        })();
    if (!state) return;
    const status = tile.querySelector('.status');
    status.innerHTML = '';
    if (state.isHost) status.appendChild(makeBadge('host', '👑 Host'));
    if (state.sharing) status.appendChild(makeBadge('share', '🖥️ Sharing'));
    if (state.handRaised) status.appendChild(makeBadge('warn', '✋'));
    if (!state.mic) status.appendChild(makeBadge('danger', '🔇'));
    if (!state.cam) status.appendChild(makeBadge('danger', '📷❌'));
    tile.classList.toggle('cam-off', !state.cam);
    tile.querySelector('.label').textContent = state.name;
  }

  function makeBadge(cls, text) {
    const span = document.createElement('span');
    span.className = 'badge ' + cls;
    span.textContent = text;
    return span;
  }

  function flyReaction(tileId, emoji) {
    const tile = document.getElementById('tile-' + tileId);
    if (!tile) return;
    let layer = tile.querySelector('.reaction-layer');
    if (!layer) {
      layer = document.createElement('div');
      layer.className = 'reaction-layer';
      tile.appendChild(layer);
    }
    const span = document.createElement('span');
    span.className = 'reaction-fly';
    span.textContent = emoji;
    layer.appendChild(span);
    setTimeout(() => span.remove(), 2500);
  }

  function showError(msg) {
    lobbyError.textContent = msg;
    lobbyError.style.display = 'block';
  }

  async function getLocalMedia() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: { echoCancellation: true, noiseSuppression: true },
      });
      return stream;
    } catch (err) {
      console.error('getUserMedia failed', err);
      throw new Error('Cannot access camera/microphone. Please allow permissions.');
    }
  }

  function ensureTile(id, label) {
    let tile = document.getElementById('tile-' + id);
    if (tile) return tile;
    tile = document.createElement('div');
    tile.className = 'tile';
    tile.id = 'tile-' + id;
    tile.innerHTML = `
      <video autoplay playsinline ${id === 'self' ? 'muted' : ''}></video>
      <div class="status"></div>
      <div class="label"></div>
    `;
    tile.querySelector('.label').textContent = label;
    tile.addEventListener('click', () => {
      if (videosEl.classList.contains('mode-spotlight')) {
        if (pinnedSpotlightId === id) pinnedSpotlightId = null;
        else pinnedSpotlightId = id;
        applyViewMode();
      }
    });
    if (currentFilter) tile.querySelector('video').classList.add('filter-' + currentFilter);
    videosEl.appendChild(tile);
    return tile;
  }

  function setTileLabel(id, label) {
    const tile = document.getElementById('tile-' + id);
    if (tile) tile.querySelector('.label').textContent = label;
  }

  function setTileMute(id, muted) {
    const tile = document.getElementById('tile-' + id);
    if (!tile) return;
    const status = tile.querySelector('.status');
    let badge = status.querySelector('.badge.mute');
    if (muted && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge mute';
      badge.textContent = '🔇';
      status.appendChild(badge);
    } else if (!muted && badge) {
      badge.remove();
    }
  }

  function attachStream(id, stream) {
    const tile = ensureTile(id, id === 'self' ? `${displayName} (you)` : id);
    const video = tile.querySelector('video');
    if (video.srcObject !== stream) video.srcObject = stream;
  }

  function removeTile(id) {
    const tile = document.getElementById('tile-' + id);
    if (tile) tile.remove();
  }

  function createPeer(remoteId, remoteName, isInitiator) {
    const pc = new RTCPeerConnection(rtcConfig);
    const entry = {
      pc,
      name: remoteName || remoteId,
      polite: !isInitiator,
      makingOffer: false,
      ignoreOffer: false,
      videoSender: null,
      audioSender: null,
      mic: true,
      cam: true,
      sharing: false,
      handRaised: false,
    };
    peers.set(remoteId, entry);

    // Add local tracks
    if (localStream) {
      for (const track of localStream.getTracks()) {
        const sender = pc.addTrack(track, localStream);
        if (track.kind === 'video') entry.videoSender = sender;
        if (track.kind === 'audio') entry.audioSender = sender;
      }
    }

    pc.onicecandidate = (e) => {
      if (e.candidate) socket.emit('signal', { to: remoteId, data: { candidate: e.candidate } });
    };

    pc.ontrack = (e) => {
      const [stream] = e.streams;
      attachStream(remoteId, stream);
      setTileLabel(remoteId, entry.name);
      renderTileState(remoteId);
    };

    pc.onnegotiationneeded = async () => {
      try {
        entry.makingOffer = true;
        await pc.setLocalDescription();
        socket.emit('signal', { to: remoteId, data: { description: pc.localDescription } });
      } catch (err) {
        console.error('negotiation error', err);
      } finally {
        entry.makingOffer = false;
      }
    };

    pc.onconnectionstatechange = () => {
      if (['failed', 'closed'].includes(pc.connectionState)) {
        cleanupPeer(remoteId);
      }
    };

    return entry;
  }

  function cleanupPeer(id) {
    const entry = peers.get(id);
    if (!entry) return;
    try { entry.pc.close(); } catch {}
    peers.delete(id);
    removeTile(id);
    if (pinnedSpotlightId === id) pinnedSpotlightId = null;
    renderPeerList();
    applyViewMode();
  }

  async function handleSignal(from, data) {
    let entry = peers.get(from);
    if (!entry) entry = createPeer(from, from, false);
    const pc = entry.pc;

    try {
      if (data.description) {
        const desc = data.description;
        const offerCollision = desc.type === 'offer' && (entry.makingOffer || pc.signalingState !== 'stable');
        entry.ignoreOffer = !entry.polite && offerCollision;
        if (entry.ignoreOffer) return;
        await pc.setRemoteDescription(desc);
        if (desc.type === 'offer') {
          await pc.setLocalDescription();
          socket.emit('signal', { to: from, data: { description: pc.localDescription } });
        }
      } else if (data.candidate) {
        try {
          await pc.addIceCandidate(data.candidate);
        } catch (err) {
          if (!entry.ignoreOffer) console.error('addIceCandidate error', err);
        }
      }
    } catch (err) {
      console.error('signal handling error', err);
    }
  }

  function renderPeerList() {
    const iAmHost = hostId && hostId === selfId;
    const items = [];
    const selfBadges = [
      hostId === selfId ? '<span class="mark" title="Host">👑</span>' : '',
      handRaised ? '<span class="mark" title="Raised hand">✋</span>' : '',
      !micOn ? '<span class="mark" title="Muted">🔇</span>' : '',
      !camOn ? '<span class="mark" title="Camera off">📷❌</span>' : '',
    ].join('');
    items.push(`<div class="peer"><span class="dot"></span><span class="name">${escapeHtml(displayName)} (you)</span>${selfBadges}</div>`);
    for (const [id, entry] of peers) {
      const peerIsHost = hostId === id;
      const badges = [
        peerIsHost ? '<span class="mark" title="Host">👑</span>' : '',
        entry.handRaised ? '<span class="mark" title="Raised hand">✋</span>' : '',
        !entry.mic ? '<span class="mark" title="Muted">🔇</span>' : '',
        !entry.cam ? '<span class="mark" title="Camera off">📷❌</span>' : '',
      ].join('');
      const muteBtn = iAmHost && !peerIsHost && entry.mic
        ? `<button class="mute-btn danger" data-mute="${id}" title="บังคับปิดไมค์">🔇 ปิดไมค์</button>`
        : '';
      items.push(`<div class="peer"><span class="dot"></span><span class="name">${escapeHtml(entry.name)}</span>${badges}${muteBtn}</div>`);
    }
    peerListEl.innerHTML = items.join('');
    peopleCountEl.textContent = String(peers.size + 1);
  }

  peerListEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mute]');
    if (!btn) return;
    if (hostId !== selfId) return;
    const targetId = btn.dataset.mute;
    if (socket && socket.connected) socket.emit('force-mute', { to: targetId });
    showToast('ส่งคำสั่งปิดไมค์ไปแล้ว', 1500);
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function addChatMessage({ name, message, ts, from }) {
    const div = document.createElement('div');
    div.className = 'msg';
    const time = new Date(ts || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const who = from === selfId ? `${name} (you)` : name;
    div.innerHTML = `<div class="meta">${escapeHtml(who)} · ${time}</div><div class="body">${escapeHtml(message)}</div>`;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  async function startShare() {
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    } catch (err) {
      console.warn('getDisplayMedia cancelled', err);
      return;
    }
    const [screenTrack] = screenStream.getVideoTracks();
    if (!screenTrack) return;

    // Swap the outbound video track for every peer
    for (const entry of peers.values()) {
      if (entry.videoSender) await entry.videoSender.replaceTrack(screenTrack);
    }

    // Show locally — clear the cosmetic CSS filter so the screen isn't tinted
    const localPreview = new MediaStream([screenTrack, ...(localStream.getAudioTracks())]);
    attachStream('self', localPreview);
    const selfVideo = document.querySelector('#tile-self video');
    if (selfVideo) selfVideo.classList.remove('filter-grayscale', 'filter-sepia', 'filter-soft', 'filter-vivid', 'filter-noir');
    // Suspend the canvas pipeline while sharing — the screen track owns the sender
    stopFilterPipeline();
    sharing = true;
    toggleShare.classList.add('primary');
    toggleShare.textContent = '🛑 Stop share';

    screenTrack.onended = () => {
      stopShare();
      renderTileState('self');
      emitState({ sharing: false });
      applyViewMode();
    };
  }

  async function stopShare() {
    if (!sharing) return;
    sharing = false;
    toggleShare.classList.remove('primary');
    toggleShare.textContent = '🖥️ Share';

    if (screenStream) {
      for (const t of screenStream.getTracks()) t.stop();
      screenStream = null;
    }

    const camTrack = cameraStream && cameraStream.getVideoTracks()[0];
    for (const entry of peers.values()) {
      if (entry.videoSender) await entry.videoSender.replaceTrack(camTrack || null);
    }
    attachStream('self', localStream);
    // Re-apply the filter pipeline if one was active before sharing
    if (currentFilter) await applyVideoFilter(currentFilter);
  }

  // ----- Video filter pipeline -----
  // CSS filter handles the local preview cheaply. For the outbound stream,
  // build a canvas with `ctx.filter` and replace each peer's video sender
  // with the canvas-captured track so other participants see the filter too.
  let filterCanvas = null;
  let filterCanvasStream = null;
  let filterRafId = null;
  let filterSourceVideo = null;

  const FILTER_CSS = {
    grayscale: 'grayscale(1)',
    sepia: 'sepia(.85)',
    soft: 'blur(.4px) saturate(1.15) brightness(1.05)',
    vivid: 'contrast(1.2) saturate(1.4)',
    noir: 'grayscale(1) contrast(1.3) brightness(1.05)',
  };

  function stopFilterPipeline() {
    if (filterRafId) cancelAnimationFrame(filterRafId);
    filterRafId = null;
    if (filterCanvasStream) {
      for (const t of filterCanvasStream.getTracks()) t.stop();
      filterCanvasStream = null;
    }
  }

  async function applyVideoFilter(name) {
    currentFilter = name || '';

    // Local preview: just CSS on every tile's <video> for instant feedback.
    for (const video of videosEl.querySelectorAll('video')) {
      video.classList.remove('filter-grayscale', 'filter-sepia', 'filter-soft', 'filter-vivid', 'filter-noir');
      if (currentFilter) video.classList.add('filter-' + currentFilter);
    }

    // Outbound: skip while screen sharing — the screen track owns the video sender.
    if (sharing) return;

    stopFilterPipeline();

    if (!currentFilter) {
      // Restore the raw camera track on each peer's outbound video sender.
      const rawTrack = cameraStream && cameraStream.getVideoTracks()[0];
      for (const entry of peers.values()) {
        if (entry.videoSender) await entry.videoSender.replaceTrack(rawTrack || null);
      }
      return;
    }

    if (!cameraStream) return;

    if (!filterSourceVideo) {
      filterSourceVideo = document.createElement('video');
      filterSourceVideo.autoplay = true;
      filterSourceVideo.playsInline = true;
      filterSourceVideo.muted = true;
    }
    filterSourceVideo.srcObject = cameraStream;
    await filterSourceVideo.play().catch(() => {});

    if (!filterCanvas) filterCanvas = document.createElement('canvas');
    const camTrack = cameraStream.getVideoTracks()[0];
    const settings = camTrack ? camTrack.getSettings() : {};
    filterCanvas.width = settings.width || 1280;
    filterCanvas.height = settings.height || 720;

    const ctx = filterCanvas.getContext('2d');
    const cssFilter = FILTER_CSS[currentFilter] || 'none';
    function draw() {
      if (filterSourceVideo.readyState >= 2) {
        ctx.filter = cssFilter;
        ctx.drawImage(filterSourceVideo, 0, 0, filterCanvas.width, filterCanvas.height);
      }
      filterRafId = requestAnimationFrame(draw);
    }
    draw();

    filterCanvasStream = filterCanvas.captureStream(30);
    const filteredTrack = filterCanvasStream.getVideoTracks()[0];
    for (const entry of peers.values()) {
      if (entry.videoSender) await entry.videoSender.replaceTrack(filteredTrack);
    }
  }

  function collectRemoteAudioTracks() {
    const tracks = [];
    for (const tile of document.querySelectorAll('#videos .tile video')) {
      const s = tile.srcObject;
      if (!s || s === localStream) continue;
      for (const t of s.getAudioTracks()) tracks.push(t);
    }
    return tracks;
  }

  function buildMixedRecordStream() {
    const tracks = [];
    const localVideo = localStream.getVideoTracks()[0];
    if (localVideo) tracks.push(localVideo);
    const localAudio = localStream.getAudioTracks()[0];
    if (localAudio) tracks.push(localAudio);
    tracks.push(...collectRemoteAudioTracks());
    return new MediaStream(tracks);
  }

  function buildAudioOnlyStream() {
    const tracks = [];
    const localAudio = localStream.getAudioTracks()[0];
    if (localAudio) tracks.push(localAudio);
    tracks.push(...collectRemoteAudioTracks());
    return new MediaStream(tracks);
  }

  function pickVideoMime() {
    for (const m of ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']) {
      if (MediaRecorder.isTypeSupported(m)) return m;
    }
    return '';
  }

  function pickAudioMime() {
    for (const m of ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus']) {
      if (MediaRecorder.isTypeSupported(m)) return m;
    }
    return '';
  }

  function startRecording() {
    const mixed = buildMixedRecordStream();
    const videoMime = pickVideoMime();
    const audioMime = pickAudioMime();

    recordedChunks = [];
    audioChunks = [];
    lastVideoBlob = null;
    lastAudioBlob = null;
    lastSummary = null;

    try {
      recorder = new MediaRecorder(mixed, videoMime ? { mimeType: videoMime, videoBitsPerSecond: 2_500_000 } : undefined);
    } catch (err) {
      alert('Recording is not supported in this browser.');
      return;
    }
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) recordedChunks.push(e.data); };
    recorder.onstop = () => {
      lastVideoBlob = new Blob(recordedChunks, { type: 'video/webm' });
      maybeOpenRecModal();
    };

    try {
      const audioStream = buildAudioOnlyStream();
      audioRecorder = new MediaRecorder(audioStream, audioMime ? { mimeType: audioMime, audioBitsPerSecond: 128_000 } : undefined);
      audioRecorder.ondataavailable = (e) => { if (e.data && e.data.size) audioChunks.push(e.data); };
      audioRecorder.onstop = () => {
        lastAudioBlob = new Blob(audioChunks, { type: audioMime || 'audio/webm' });
        maybeOpenRecModal();
      };
      audioRecorder.start(1000);
    } catch (err) {
      console.warn('audio-only recorder unavailable', err);
      audioRecorder = null;
    }

    recordingStartedAt = Date.now();
    recorder.start(1000);
    toggleRecord.innerHTML = '<span class="rec-dot"></span>Stop';
    toggleRecord.classList.add('danger');
  }

  let _modalOpenedForThisRecording = false;
  function maybeOpenRecModal() {
    const videoDone = !recorder || recorder.state === 'inactive';
    const audioDone = !audioRecorder || audioRecorder.state === 'inactive';
    if (!videoDone || !audioDone) return;
    if (_modalOpenedForThisRecording) return;
    if (!lastVideoBlob && !lastAudioBlob) return;
    _modalOpenedForThisRecording = true;
    openRecModal();
  }

  function stopRecording() {
    _modalOpenedForThisRecording = false;
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    if (audioRecorder && audioRecorder.state !== 'inactive') audioRecorder.stop();
    toggleRecord.textContent = '⏺️ Record';
    toggleRecord.classList.remove('danger');
  }

  // ----- Post-recording modal -----
  const recModal = document.getElementById('rec-modal');
  const recInfo = document.getElementById('rec-info');
  const btnDownloadVideo = document.getElementById('btn-download-video');
  const btnSummarize = document.getElementById('btn-summarize');
  const btnDownloadSummary = document.getElementById('btn-download-summary');
  const btnModalDone = document.getElementById('btn-modal-done');
  const btnModalClose = document.getElementById('rec-modal-close');
  const summaryResult = document.getElementById('summary-result');
  const summaryMd = document.getElementById('summary-md');
  const summaryTranscript = document.getElementById('summary-transcript');
  const summaryError = document.getElementById('summary-error');

  function openRecModal() {
    const durSec = Math.round((Date.now() - recordingStartedAt) / 1000);
    const min = Math.floor(durSec / 60);
    const sec = durSec % 60;
    const vSize = lastVideoBlob ? (lastVideoBlob.size / 1024 / 1024).toFixed(1) + ' MB' : '—';
    const aSize = lastAudioBlob ? (lastAudioBlob.size / 1024 / 1024).toFixed(2) + ' MB' : '—';
    recInfo.textContent = `ความยาว ~${min}:${String(sec).padStart(2, '0')} • วิดีโอ ${vSize} • เสียง ${aSize}`;
    summaryResult.style.display = 'none';
    summaryError.style.display = 'none';
    btnDownloadSummary.style.display = 'none';
    btnSummarize.disabled = !lastAudioBlob;
    btnSummarize.innerHTML = '🤖 สรุปด้วย AI';
    btnDownloadVideo.disabled = !lastVideoBlob;
    recModal.classList.add('open');
  }

  function closeRecModal() {
    recModal.classList.remove('open');
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function tsName() {
    return new Date().toISOString().replace(/[:.]/g, '-');
  }

  btnDownloadVideo.addEventListener('click', () => {
    if (!lastVideoBlob) return;
    downloadBlob(lastVideoBlob, `meeting-${roomId}-${tsName()}.webm`);
  });

  btnDownloadSummary.addEventListener('click', () => {
    if (!lastSummary) return;
    const blob = new Blob([lastSummary], { type: 'text/markdown;charset=utf-8' });
    downloadBlob(blob, `meeting-${roomId}-${tsName()}-summary.md`);
  });

  btnModalDone.addEventListener('click', closeRecModal);
  btnModalClose.addEventListener('click', closeRecModal);

  btnSummarize.addEventListener('click', async () => {
    if (!lastAudioBlob) return;
    if (lastAudioBlob.size > 25 * 1024 * 1024) {
      summaryError.textContent = 'ไฟล์เสียงใหญ่กว่า 25MB ซึ่งเป็น limit ของ Whisper — ลองบันทึกสั้นลง';
      summaryError.style.display = 'block';
      return;
    }
    summaryError.style.display = 'none';
    btnSummarize.disabled = true;
    btnSummarize.innerHTML = '<span class="spinner"></span>กำลังสรุป...';
    try {
      const form = new FormData();
      form.append('audio', lastAudioBlob, `meeting-${roomId}-${tsName()}.webm`);
      const resp = await fetch('/api/summarize', { method: 'POST', body: form });
      const data = await resp.json();
      if (!resp.ok) {
        const msg = data.message || data.error || `HTTP ${resp.status}`;
        throw new Error(msg);
      }
      lastSummary = data.summary || '';
      summaryMd.textContent = lastSummary;
      summaryTranscript.textContent = data.transcript || '';
      summaryResult.style.display = 'block';
      btnDownloadSummary.style.display = '';
      btnSummarize.innerHTML = '✅ สรุปแล้ว';
    } catch (err) {
      console.error('summarize failed', err);
      summaryError.textContent = 'สรุปไม่สำเร็จ: ' + err.message;
      summaryError.style.display = 'block';
      btnSummarize.disabled = false;
      btnSummarize.innerHTML = '🤖 ลองใหม่';
    }
  });

  // ----- Lobby actions -----
  joinBtn.addEventListener('click', joinFlow);
  roomInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinFlow(); });
  nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinFlow(); });

  async function joinFlow() {
    lobbyError.style.display = 'none';
    displayName = (nameInput.value || '').trim() || 'Guest';
    roomId = (roomInput.value || '').trim();
    if (!roomId) { showError('Please enter a room code.'); return; }
    localStorage.setItem('mr_name', displayName);

    joinBtn.disabled = true;
    joinBtn.textContent = 'Joining…';

    try {
      localStream = await getLocalMedia();
      cameraStream = localStream;
    } catch (err) {
      showError(err.message);
      joinBtn.disabled = false;
      joinBtn.textContent = 'Join meeting';
      return;
    }

    lobby.style.display = 'none';
    room.style.display = 'grid';
    roomTagName.textContent = roomId;
    attachStream('self', localStream);
    setTileLabel('self', `${displayName} (you)`);
    applyViewMode();

    // Update URL so it's easy to share
    const url = new URL(location.href);
    url.searchParams.set('room', roomId);
    history.replaceState(null, '', url.toString());

    socket = io({ transports: ['websocket', 'polling'] });

    socket.on('connect', () => {
      socket.emit('join', { roomId, name: displayName }, (resp) => {
        if (!resp || !resp.ok) { showError('Failed to join room.'); return; }
        selfId = resp.selfId;
        hostId = resp.hostId;
        // For each existing peer, we are the new arrival → we initiate.
        for (const p of resp.peers) {
          const entry = createPeer(p.id, p.name, true);
          entry.mic = p.mic;
          entry.cam = p.cam;
          entry.sharing = p.sharing;
          entry.handRaised = p.handRaised;
        }
        renderTileState('self');
        renderPeerList();
        applyViewMode();
        // Push our initial state so the rest of the room knows our mic/cam status
        emitState({ mic: micOn, cam: camOn, sharing, handRaised });
      });
    });

    socket.on('peer-joined', ({ id, name }) => {
      // Existing peer: do NOT initiate, the newcomer will.
      if (!peers.has(id)) createPeer(id, name, false);
      renderPeerList();
    });

    socket.on('peer-left', ({ id }) => cleanupPeer(id));

    socket.on('peers', (msg) => {
      // msg = { hostId, peers: [{id,name,mic,cam,sharing,handRaised}, ...] }
      const previousHost = hostId;
      hostId = msg.hostId;
      for (const p of msg.peers) {
        if (p.id === selfId) continue;
        const entry = peers.get(p.id);
        if (!entry) continue;
        entry.name = p.name;
        entry.mic = p.mic;
        entry.cam = p.cam;
        entry.sharing = p.sharing;
        entry.handRaised = p.handRaised;
        renderTileState(p.id);
      }
      renderTileState('self');
      renderPeerList();
      applyViewMode();
      if (previousHost !== hostId && hostId === selfId) {
        showToast('คุณคือ host ของห้องนี้แล้ว');
      }
    });

    socket.on('signal', ({ from, data }) => handleSignal(from, data));

    socket.on('chat', (msg) => addChatMessage(msg));

    socket.on('forced-mute', () => {
      if (!micOn) return;
      micOn = false;
      if (localStream) localStream.getAudioTracks().forEach((t) => { t.enabled = false; });
      toggleMic.textContent = '🔇 Mic off';
      toggleMic.classList.add('danger');
      emitState({ mic: false });
      renderTileState('self');
      showToast('Host ปิดเสียงไมค์ของคุณแล้ว — กด 🎤 เพื่อเปิดอีกครั้ง', 4000);
    });

    socket.on('reaction', ({ from, emoji }) => {
      flyReaction(from === selfId ? 'self' : from, emoji);
    });
  }

  // ----- Bar actions -----
  toggleMic.addEventListener('click', () => {
    if (!localStream) return;
    micOn = !micOn;
    localStream.getAudioTracks().forEach((t) => { t.enabled = micOn; });
    toggleMic.textContent = micOn ? '🎤 Mic' : '🔇 Mic off';
    toggleMic.classList.toggle('danger', !micOn);
    renderTileState('self');
    emitState({ mic: micOn });
  });

  toggleCam.addEventListener('click', () => {
    if (!localStream) return;
    camOn = !camOn;
    localStream.getVideoTracks().forEach((t) => { t.enabled = camOn; });
    toggleCam.textContent = camOn ? '📷 Cam' : '📷 Cam off';
    toggleCam.classList.toggle('danger', !camOn);
    renderTileState('self');
    emitState({ cam: camOn });
  });

  toggleShare.addEventListener('click', async () => {
    if (sharing) await stopShare();
    else await startShare();
    renderTileState('self');
    emitState({ sharing });
    applyViewMode();
  });

  toggleHand.addEventListener('click', () => {
    handRaised = !handRaised;
    toggleHand.classList.toggle('active', handRaised);
    toggleHand.textContent = handRaised ? '✋ ลดมือ' : '✋ ยกมือ';
    renderTileState('self');
    emitState({ handRaised });
    if (handRaised) showToast('คุณยกมือแล้ว — แตะ "ลดมือ" เพื่อเอาออก', 2000);
  });

  // ----- Popup helpers -----
  function closeAllPopups(except) {
    for (const p of [reactPopup, filterPopup, viewPopup]) {
      if (p !== except) p.classList.remove('open');
    }
  }
  function togglePopup(p, anchor) {
    const open = p.classList.contains('open');
    closeAllPopups();
    if (!open) {
      p.classList.add('open');
      // Position near the anchor button
      const rect = anchor.getBoundingClientRect();
      const barRect = anchor.parentElement.getBoundingClientRect();
      p.style.left = Math.max(8, rect.left - barRect.left) + 'px';
    }
  }
  toggleReact.addEventListener('click', () => togglePopup(reactPopup, toggleReact));
  toggleFilter.addEventListener('click', () => togglePopup(filterPopup, toggleFilter));
  toggleView.addEventListener('click', () => togglePopup(viewPopup, toggleView));
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.popup') && !e.target.closest('#toggle-react, #toggle-filter, #toggle-view')) {
      closeAllPopups();
    }
  });

  reactPopup.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-emoji]');
    if (!btn) return;
    if (socket && socket.connected) socket.emit('reaction', { emoji: btn.dataset.emoji });
    closeAllPopups();
  });

  viewPopup.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-view]');
    if (!btn) return;
    const val = btn.dataset.view;
    if (val === 'spotlight') {
      viewMode = 'spotlight';
    } else {
      const [mode, size] = val.split(':');
      viewMode = mode;
      gridSize = size;
    }
    localStorage.setItem('mr_view_mode', viewMode);
    localStorage.setItem('mr_grid_size', gridSize);
    for (const b of viewPopup.querySelectorAll('button[data-view]')) {
      b.classList.toggle('active', b.dataset.view === val);
    }
    pinnedSpotlightId = null;
    applyViewMode();
    closeAllPopups();
  });

  filterPopup.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    const f = btn.dataset.filter;
    for (const b of filterPopup.querySelectorAll('button[data-filter]')) {
      b.classList.toggle('active', b.dataset.filter === f);
    }
    await applyVideoFilter(f);
    closeAllPopups();
  });

  toggleRecord.addEventListener('click', () => {
    if (recorder && recorder.state === 'recording') stopRecording();
    else startRecording();
  });

  leaveBtn.addEventListener('click', () => {
    for (const id of [...peers.keys()]) cleanupPeer(id);
    if (socket) socket.disconnect();
    if (localStream) for (const t of localStream.getTracks()) t.stop();
    if (screenStream) for (const t of screenStream.getTracks()) t.stop();
    if (recorder && recorder.state === 'recording') recorder.stop();
    if (audioRecorder && audioRecorder.state === 'recording') audioRecorder.stop();
    // Navigate to a URL without ?room= so the auto-join guard doesn't fire on the
    // fresh page; plain location.reload() would keep the query string and bounce
    // the user straight back into the same meeting.
    location.href = location.pathname;
  });

  // ----- Tabs -----
  document.querySelectorAll('.tabs button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach((b) => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ----- Chat -----
  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const message = chatInput.value.trim();
    if (!message || !socket) return;
    socket.emit('chat', { message });
    chatInput.value = '';
  });

  // ----- Copy / share invite link -----
  function buildInviteLink() {
    const url = new URL(location.href);
    url.searchParams.set('room', roomId);
    url.searchParams.delete('lobby');
    return url.toString();
  }

  function flashCopied() {
    const original = copyLinkBtn.innerHTML;
    copyLinkBtn.innerHTML = '✓ คัดลอกแล้ว';
    copyLinkBtn.classList.add('primary');
    setTimeout(() => {
      copyLinkBtn.innerHTML = original;
      copyLinkBtn.classList.remove('primary');
    }, 1800);
  }

  const isMobile = /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent);

  copyLinkBtn.addEventListener('click', async () => {
    const link = buildInviteLink();
    if (navigator.share && isMobile) {
      try {
        await navigator.share({ title: 'Meeting Room', text: `เข้าห้องประชุม: ${roomId}`, url: link });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }
    try {
      await navigator.clipboard.writeText(link);
      flashCopied();
    } catch {
      window.prompt('คัดลอกลิงก์นี้:', link);
    }
  });

  // ----- Auto-join from shared link -----
  if (autoJoin) {
    setTimeout(joinFlow, 50);
  }
})();
</script>
</body>
</html>
